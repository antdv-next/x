  <rect x="34" y="19" width="44" height="6" rx="3" fill="#262626"/>
  <rect x="118" y="19" width="26" height="6" rx="3" fill="#D9D9D9"/>
  <!-- row 1: completed -->
  <circle cx="22" cy="42" r="6" fill="#52C41A"/>
  <path d="M19.4 42.2 21.4 44.2 24.8 40.6" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="39" width="70" height="6" rx="3" fill="#D9D9D9"/>
  <rect x="34" y="41" width="70" height="1.5" rx="0.75" fill="#BFBFBF"/>
  <!-- row 2: in progress -->
  <circle cx="22" cy="62" r="6" fill="none" stroke="#1677FF" stroke-width="1.6" stroke-dasharray="20 40" transform="rotate(-90 22 62)"/>
  <circle cx="22" cy="62" r="6" fill="none" stroke="#E6F4FF" stroke-width="1.6"/>
  <rect x="34" y="59" width="88" height="6" rx="3" fill="#BFBFBF"/>
  <rect x="128" y="59" width="16" height="6" rx="3" fill="#91CAFF"/>
  <!-- row 3: pending -->
