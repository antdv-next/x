<?xml version="1.0" encoding="UTF-8"?>
<svg width="160px" height="104px" viewBox="0 0 160 104" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>TodoList</title>
  <rect x="8" y="8" width="144" height="88" rx="6" fill="#FFFFFF" stroke="#F0F0F0"/>
